<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuaNThoR Mizar Verification System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QuaNThoR Verification</h1>
            <p>Containerized Mizar verification with Ollama-assisted explanations.</p>
        </header>
        <main class="main-grid">
            <div class="editor-container">
                <h2>Proof Editor</h2>
                <textarea id="proof-editor" placeholder="Enter your Mizar proof here..."></textarea>
                <button id="verify-button">Verify Proof</button>
            </div>
            <div class="results-container">
                <h2>AI Assistant</h2>
                <div id="results-panel">
                    <div class="placeholder">
                        <p>Your AI-enhanced analysis will appear here.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
