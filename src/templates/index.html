<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuaNThoR Mizar Verifier</title>
    <style>
        body { font-family: sans-serif; margin: 2em; background-color: #f4f4f9; line-height: 1.5; }
        .container { max-width: 900px; margin: auto; background: white; padding: 2em; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-top: 0; }
        .status { margin: 1rem 0; padding: 0.75rem 1rem; background: #eef4ff; border-left: 4px solid #4c6ef5; }
        textarea { width: 100%; height: 300px; box-sizing: border-box; margin-bottom: 1em; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background-color: #eee; padding: 1em; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mizar Proof Verifier</h1>
        <p>Paste a Mizar article. The API runs Mizar in Docker and can use Ollama for explanations.</p>
        <div id="runtimeStatus" class="status">Checking runtime...</div>
        <textarea id="mizarCode" placeholder="environ ... begin ... theorem ... proof ... end;"></textarea>
        <button onclick="verifyProof()">Verify</button>
        <h2>Result:</h2>
        <pre id="resultOutput">The verifier output will appear here.</pre>
    </div>

    <script>
        async function verifyProof() {
            const code = document.getElementById('mizarCode').value;
            const outputElement = document.getElementById('resultOutput');
            outputElement.textContent = 'Verifying...';

            const response = await fetch('/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });

            const data = await response.json();
            if (data.status === 'success') {
                outputElement.textContent = `✅ Verification Successful!\n\n${data.raw_output}`;
            } else if (data.status === 'failure') {
                let errorDisplay = `❌ Verification Failed\n\nErrors Found:\n`;
                data.errors.forEach(error => {
                    errorDisplay += `• Line ${error.line}, Column ${error.character}: ${error.message}\n`;
                });
                errorDisplay += `\nFull Output:\n${data.raw_output}`;
                outputElement.textContent = errorDisplay;
            } else {
                outputElement.textContent = `⚠️ Error: ${data.message}`;
            }
        }

        async function loadRuntimeStatus() {
            const statusElement = document.getElementById('runtimeStatus');
            try {
                const response = await fetch('/health');
                const data = await response.json();
                const ollama = data.ollama_base_url || 'not configured';
                const mizar = data.mizar_available ? data.mizar_command : 'not found';
                statusElement.textContent = `Mizar: ${mizar} | Ollama: ${ollama} | Timeout: ${data.timeout_seconds}s`;
            } catch (error) {
                statusElement.textContent = 'Runtime status unavailable. Check the backend container.';
            }
        }

        window.addEventListener('DOMContentLoaded', loadRuntimeStatus);
    </script>
</body>
</html>
