services:
  quanthor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MIZAR_TIMEOUT_SECONDS: ${MIZAR_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
      OLLAMA_MIZAR_MODEL: ${OLLAMA_MIZAR_MODEL:-gemma4:31b}
      OLLAMA_ROUTER_MODEL: ${OLLAMA_ROUTER_MODEL:-mizar-specialist}
      OLLAMA_CLOUD_TOKEN: ${OLLAMA_CLOUD_TOKEN:-}
      HIPPORAG_ENABLED: ${HIPPORAG_ENABLED:-false}
      HIPPORAG_SAVE_DIR: ${HIPPORAG_SAVE_DIR:-/app/outputs/hipporag}
      HIPPORAG_LLM_MODEL: ${HIPPORAG_LLM_MODEL:-gemma4:31b}
      HIPPORAG_LLM_BASE_URL: ${HIPPORAG_LLM_BASE_URL:-}
      HIPPORAG_EMBEDDING_MODEL: ${HIPPORAG_EMBEDDING_MODEL:-nomic-embed-text}
      HIPPORAG_EMBEDDING_BASE_URL: ${HIPPORAG_EMBEDDING_BASE_URL:-}
      HIPPORAG_TOP_K: ${HIPPORAG_TOP_K:-5}
      HIPPORAG_SERVICE_URL: ${HIPPORAG_SERVICE_URL:-}
      HIPPORAG_REQUEST_TIMEOUT_SECONDS: ${HIPPORAG_REQUEST_TIMEOUT_SECONDS:-120}
    ports:
      - "${QUANTHOR_HOST_PORT:-5050}:5000"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped

  hipporag:
    profiles:
      - hipporag
    build:
      context: .
      dockerfile: Dockerfile.hipporag
    environment:
      HIPPORAG_ENABLED: ${HIPPORAG_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CLOUD_TOKEN: ${OLLAMA_CLOUD_TOKEN:-}
      HIPPORAG_SAVE_DIR: ${HIPPORAG_SAVE_DIR:-/app/outputs/hipporag}
      HIPPORAG_LLM_MODEL: ${HIPPORAG_LLM_MODEL:-gemma4:31b}
      HIPPORAG_LLM_BASE_URL: ${HIPPORAG_LLM_BASE_URL:-}
      HIPPORAG_EMBEDDING_MODEL: ${HIPPORAG_EMBEDDING_MODEL:-nomic-embed-text}
      HIPPORAG_EMBEDDING_BASE_URL: ${HIPPORAG_EMBEDDING_BASE_URL:-}
      HIPPORAG_TOP_K: ${HIPPORAG_TOP_K:-5}
    ports:
      - "${HIPPORAG_HOST_PORT:-5100}:5100"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped

  docs:
    image: squidfunk/mkdocs-material
    profiles:
      - docs
    working_dir: /workspace
    command: ["serve", "--dev-addr", "0.0.0.0:8000"]
    volumes:
      - ./:/workspace
    ports:
      - "${QUANTHOR_DOCS_PORT:-8000}:8000"
    restart: unless-stopped
