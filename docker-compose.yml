services:
  quanthor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MIZAR_TIMEOUT_SECONDS: ${MIZAR_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    ports:
      - "5000:5000"
    restart: unless-stopped
