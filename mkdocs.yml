site_name: QuaNThoR
site_description: Documentation technique et pédagogique pour l'assistant de vérification
  Mizar.
site_author: QuaNThoR
docs_dir: docs
theme:
  name: material
  language: fr
  features:
  - navigation.instant
  - navigation.sections
  - toc.integrate
  - search.highlight
  - content.code.copy
  - navigation.tracking
  - navigation.expand
  - navigation.indexes
  - navigation.top
  - search.suggest
  - toc.follow
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: deep purple
    toggle:
      icon: material/weather-night
      name: Switch to dark Education mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Switch to light Education mode
  custom_dir: overrides
  logo: assets/education/education-icon.png
  favicon: assets/education/education-icon.png
nav:
- Accueil: wiki/Home.md
- Accessibility:
  - Edge User Console: accessibility/edge-user-console.md
- Démarrage:
  - Installation: wiki/01-installation.md
  - Usage quotidien: wiki/02-usage.md
  - Contrat API: wiki/03-api.md
  - Dépannage: wiki/04-troubleshooting.md
  - Survie Mizar: wiki/05-mizar-survival.md
- Documentation auto:
  - Documentation générée automatiquement: generated/documentation-summary.md
  - Endpoints API: generated/api-endpoints.md
  - Variables d'environnement: generated/environment-variables.md
  - Plan d'action docs: wiki/06-documentation-automation.md
plugins:
- search
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed
- pymdownx.highlight
- toc:
    permalink: true
- attr_list
- md_in_html
- tables
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
extra_css:
- stylesheets/securedme-education.css
- stylesheets/securedme-theme-toggle.css
- stylesheets/securedme-accessibility.css
extra_javascript:
- javascripts/securedme-theme-toggle.js
- javascripts/securedme-accessibility.js
